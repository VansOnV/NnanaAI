<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nnana AI</title>

<!-- Home screen / PWA icons -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">

<!-- iOS: "Add to Home Screen" -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Nnana AI">

<!-- Android / Chrome -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif;
    color: #fff;
    overflow: hidden;
  }
  .phone {
    max-width: 460px;
    margin: 0 auto;
    height: 100dvh;
    background: #000;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* Top bar */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 22px 10px;
    flex-shrink: 0;
  }
  .icon-btn {
    width: 46px; height: 46px;
    border-radius: 50%;
    background: #1a1a1c;
    display: flex; align-items: center; justify-content: center;
    color: #cfcfcf;
    cursor: pointer;
    border: none;
  }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn.small { width: 32px; height: 32px; }
  .icon-btn.small svg { width: 15px; height: 15px; }

  /* Chat area */
  .chat-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 6px 20px 10px;
    display: flex;
    flex-direction: column;
    scroll-behavior: smooth;
  }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 20px;
    padding-bottom: 40px;
    min-height: 100%;
  }
  .gear-badge {
    width: 84px; height: 84px;
    border-radius: 22px;
    background: radial-gradient(circle at 32% 28%, #6bd486, #2f9450 70%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 20px rgba(60, 180, 100, 0.25);
  }
  .gear-badge svg { width: 46px; height: 46px; color: #0d3319; }
  .empty-state h1 { font-size: 36px; font-weight: 700; letter-spacing: -0.5px; }

  .upgrade-card {
    width: 100%; max-width: 380px;
    background: #131315;
    border: 1px solid #232325;
    border-radius: 20px;
    padding: 18px 20px 20px;
    text-align: left;
  }
  .upgrade-card p { color: #9a9a9d; font-size: 14px; margin-bottom: 14px; }
  .upgrade-btn {
    width: 100%; background: #232325; color: #fff; border: none;
    border-radius: 24px; padding: 13px 0; font-size: 16px; font-weight: 600; cursor: pointer;
  }

  .bubble-row {
    display: flex;
    margin: 6px 0;
    animation: bubbleIn 0.32s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes bubbleIn {
    from { opacity: 0; transform: translateY(10px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .bubble-row.user { justify-content: flex-end; }
  .bubble-row.bot { justify-content: flex-start; }
  .bubble {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 20px;
    font-size: 16px;
    line-height: 1.45;
    white-space: pre-wrap;
  }
  .bubble.user { background: #2f7a45; color: #fff; border-bottom-right-radius: 6px; }
  .bubble.bot { background: #1a1a1c; color: #f0f0f0; border-bottom-left-radius: 6px; }

  .cursor {
    display: inline-block;
    width: 8px; height: 16px;
    background: #d8d8d8;
    margin-left: 2px;
    vertical-align: -3px;
    animation: blinkCursor 0.9s steps(1) infinite;
    border-radius: 1px;
  }
  @keyframes blinkCursor { 0%, 45% { opacity: 1; } 50%, 100% { opacity: 0; } }

  .typing { display: flex; gap: 4px; padding: 14px 16px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: #888;
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }

  /* Build/progress card */
  .build-card {
    background: #131315;
    border: 1px solid #232325;
    border-radius: 18px;
    padding: 16px 18px 18px;
    max-width: 84%;
    margin: 6px 0;
  }
  .build-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 14.5px; font-weight: 600; color: #e6e6e6;
    margin-bottom: 12px;
  }
  .build-title svg { width: 16px; height: 16px; color: #6bd486; flex-shrink: 0; animation: spin 1.4s linear infinite; }
  .build-title.done svg { animation: none; color: #4fbf6b; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .step-list { display: flex; flex-direction: column; gap: 9px; margin-bottom: 12px; }
  .step {
    display: flex; align-items: center; gap: 10px;
    font-size: 13.5px; color: #6b6b6e;
    transition: color 0.25s ease;
  }
  .step .dot {
    width: 15px; height: 15px; border-radius: 50%;
    border: 1.5px solid #3a3a3c;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s ease;
  }
  .step.active { color: #e6e6e6; }
  .step.active .dot { border-color: #6bd486; }
  .step.active .dot::after {
    content: '';
    width: 6px; height: 6px; border-radius: 50%;
    background: #6bd486;
    animation: pulseDot 1s infinite ease-in-out;
  }
  @keyframes pulseDot { 0%, 100% { opacity: 0.4; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.1); } }
  .step.done { color: #9a9a9d; }
  .step.done .dot { background: #2f9450; border-color: #2f9450; }
  .step.done .dot svg { width: 9px; height: 9px; color: #fff; }

  .progress-track {
    width: 100%; height: 5px; background: #232325; border-radius: 4px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%; background: linear-gradient(90deg, #3f9e5c, #6bd486);
    border-radius: 4px; transition: width 0.4s linear;
  }

  /* File / artifact card */
  .file-card {
    display: flex; align-items: center; gap: 12px;
    background: #131315;
    border: 1px solid #232325;
    border-radius: 16px;
    padding: 13px 14px;
    max-width: 84%;
    margin: 6px 0;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .file-card:active { transform: scale(0.98); background: #1a1a1c; }
  .file-icon {
    width: 40px; height: 40px; border-radius: 10px;
    background: linear-gradient(160deg, #3f9e5c, #235c34);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .file-icon svg { width: 20px; height: 20px; color: #fff; }
  .file-meta { flex: 1; min-width: 0; }
  .file-name { font-size: 14.5px; font-weight: 600; color: #f0f0f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-sub { font-size: 12.5px; color: #8a8a8d; margin-top: 2px; }
  .file-dl { width: 30px; height: 30px; border-radius: 50%; background: #232325; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .file-dl svg { width: 14px; height: 14px; color: #d8d8d8; }

  /* Limit / paywall card */
  .limit-card {
    background: #17130d;
    border: 1px solid #332818;
    border-radius: 18px;
    padding: 18px 18px 16px;
    max-width: 86%;
    margin: 6px 0;
  }
  .limit-icon {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(160deg, #4a3a17, #241b0a);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
  }
  .limit-icon svg { width: 22px; height: 22px; color: #f5b942; }
  .limit-title { font-size: 15.5px; font-weight: 700; color: #f0f0f0; margin-bottom: 5px; }
  .limit-sub { font-size: 13px; color: #a19a8f; line-height: 1.5; margin-bottom: 14px; }
  .limit-upgrade-btn {
    width: 100%; background: #f5b942; color: #1a1300; border: none;
    border-radius: 22px; padding: 12px 0; font-size: 15px; font-weight: 700; cursor: pointer;
    transition: transform 0.12s ease, opacity 0.2s ease;
  }
  .limit-upgrade-btn:active { transform: scale(0.97); }
  .limit-upgrade-btn:disabled { opacity: 0.6; }
  .limit-note { font-size: 11px; color: #5f5b52; text-align: center; margin-top: 9px; }

  /* Shared bottom-sheet modal */
  .modal-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 50;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .sheet {
    width: 100%; max-width: 460px;
    background: #111113;
    border: 1px solid #232325;
    border-bottom: none;
    border-radius: 26px 26px 0 0;
    padding: 20px 22px 28px;
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(.2,.8,.2,1);
    max-height: 82dvh;
    overflow-y: auto;
  }
  .modal-overlay.open .sheet { transform: translateY(0); }
  .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .sheet-header-title { font-size: 15px; font-weight: 700; color: #e6e6e6; }

  /* Pro subscription sheet */
  .pro-badge {
    width: 62px; height: 62px; border-radius: 18px;
    background: radial-gradient(circle at 30% 25%, #6bd486, #2f9450 75%);
    display: flex; align-items: center; justify-content: center;
    margin: 6px auto 14px;
  }
  .pro-badge svg { width: 30px; height: 30px; color: #0d3319; }
  .pro-title { text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .pro-sub { text-align: center; font-size: 13px; color: #9a9a9d; margin-bottom: 22px; }
  .pro-price-row { text-align: center; margin-bottom: 22px; }
  .pro-price { font-size: 46px; font-weight: 800; letter-spacing: -1px; }
  .pro-price sup { font-size: 18px; font-weight: 700; position: relative; top: -22px; margin-right: 2px; }
  .pro-period { font-size: 15px; color: #9a9a9d; margin-left: 3px; }
  .pro-compare { display: flex; gap: 10px; margin-bottom: 20px; }
  .pro-plan-col { flex: 1; background: #17171a; border: 1px solid #232325; border-radius: 14px; padding: 12px 12px 13px; }
  .pro-plan-col.highlight { border-color: #3f9e5c; background: #10190f; }
  .pro-plan-name { font-size: 12.5px; font-weight: 700; color: #cfcfcf; margin-bottom: 8px; }
  .pro-plan-col.highlight .pro-plan-name { color: #6bd486; }
  .pro-plan-item { font-size: 11.5px; color: #9a9a9d; margin-bottom: 5px; display: flex; gap: 5px; align-items: flex-start; }
  .pro-plan-item svg { width: 12px; height: 12px; flex-shrink: 0; margin-top: 2px; }
  .pro-plan-item.yes svg { color: #6bd486; }
  .pro-plan-item.no svg { color: #55555a; }
  .pro-features { display: flex; flex-direction: column; gap: 13px; margin-bottom: 24px; }
  .pro-feature { display: flex; align-items: center; gap: 10px; font-size: 14.5px; color: #e6e6e6; }
  .pro-feature svg { width: 18px; height: 18px; color: #6bd486; flex-shrink: 0; }
  .pro-subscribe-btn {
    width: 100%; background: #fff; color: #000; border: none;
    border-radius: 24px; padding: 15px 0; font-size: 16px; font-weight: 700; cursor: pointer;
    margin-bottom: 10px; transition: transform 0.12s ease, background 0.2s ease;
  }
  .pro-subscribe-btn:active { transform: scale(0.97); }
  .pro-subscribe-btn.success { background: #6bd486; }
  .pro-cancel {
    display: block; width: 100%; text-align: center; font-size: 13.5px; color: #8a8a8d;
    background: none; border: none; cursor: pointer; padding: 6px;
  }
  .pro-demo-note { text-align: center; font-size: 11px; color: #5f5b52; margin-top: 10px; }

  /* Model picker sheet */
  .model-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 6px; border-radius: 12px; cursor: pointer;
  }
  .model-row:active { background: #1a1a1c; }
  .model-row-main { display: flex; flex-direction: column; gap: 2px; }
  .model-row-name { font-size: 14.5px; font-weight: 600; color: #f0f0f0; }
  .model-row-desc { font-size: 12px; color: #8a8a8d; }
  .model-row .check { width: 18px; height: 18px; color: #6bd486; opacity: 0; flex-shrink: 0; }
  .model-row.selected .check { opacity: 1; }

  /* Sidebar drawer */
  .sidebar-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.55);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 60;
  }
  .sidebar-overlay.open { opacity: 1; pointer-events: auto; }
  .sidebar-panel {
    position: absolute; top: 0; left: 0; bottom: 0;
    width: 82%; max-width: 320px;
    background: #0c0c0d;
    border-right: 1px solid #1e1e20;
    display: flex; flex-direction: column;
    padding: 18px 14px 14px;
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
  }
  .sidebar-overlay.open .sidebar-panel { transform: translateX(0); }
  .sidebar-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding: 0 4px; }
  .sidebar-brand { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; }
  .sidebar-brand .mini-gear {
    width: 24px; height: 24px; border-radius: 7px;
    background: radial-gradient(circle at 30% 25%, #6bd486, #2f9450 75%);
    display: flex; align-items: center; justify-content: center;
  }
  .sidebar-brand .mini-gear svg { width: 13px; height: 13px; color: #0d3319; }
  .new-chat-btn {
    display: flex; align-items: center; gap: 9px;
    background: #1c1c1e; border: 1px solid #262628; color: #f0f0f0;
    border-radius: 12px; padding: 11px 13px; font-size: 14.5px; font-weight: 600;
    cursor: pointer; margin-bottom: 12px; transition: background 0.15s ease;
  }
  .new-chat-btn:active { background: #232325; }
  .new-chat-btn svg { width: 16px; height: 16px; color: #6bd486; }
  .sidebar-search {
    display: flex; align-items: center; gap: 8px;
    background: #161617; border-radius: 10px; padding: 9px 11px; margin-bottom: 14px;
  }
  .sidebar-search svg { width: 14px; height: 14px; color: #7d7d80; flex-shrink: 0; }
  .sidebar-search input {
    background: transparent; border: none; outline: none; color: #fff; font-size: 13.5px;
    width: 100%; font-family: inherit;
  }
  .sidebar-search input::placeholder { color: #6c6c6f; }
  .sidebar-section-label {
    font-size: 11.5px; font-weight: 600; color: #6c6c6f; text-transform: uppercase;
    letter-spacing: 0.03em; padding: 0 4px; margin-bottom: 6px;
  }
  .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; }
  .chat-list::-webkit-scrollbar { width: 0; }
  .chat-item {
    display: block; width: 100%; text-align: left; background: none; border: none; color: #c8c8ca;
    font-size: 13.8px; padding: 10px 10px; border-radius: 9px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .chat-item:active { background: #1a1a1c; }
  .chat-item.active { background: #1c2b1f; color: #fff; }
  .sidebar-empty { font-size: 12.5px; color: #5f5f62; padding: 10px; }
  .sidebar-footer { border-top: 1px solid #1c1c1e; padding-top: 12px; }
  .sidebar-profile { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-radius: 10px; }
  .profile-avatar {
    width: 32px; height: 32px; border-radius: 50%; background: #2f7a45; color: #fff;
    font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .profile-info { min-width: 0; }
  .profile-name { font-size: 13.5px; font-weight: 600; color: #f0f0f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .profile-plan { font-size: 11.5px; color: #8a8a8d; margin-top: 1px; }

  /* Input area */
  .input-wrap { padding: 8px 16px 24px; flex-shrink: 0; }
  .input-card {
    background: #131315;
    border: 1px solid #202022;
    border-radius: 28px;
    padding: 14px 18px 10px;
    transition: border-color 0.2s ease;
  }
  .input-card textarea {
    width: 100%; background: transparent; border: none; outline: none;
    color: #fff; font-size: 17px; resize: none; font-family: inherit; max-height: 100px;
  }
  .input-card textarea::placeholder { color: #7d7d80; }
  .input-card textarea:disabled { opacity: 0.5; }

  .input-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .left-controls { display: flex; align-items: center; gap: 10px; }
  .plus-btn {
    width: 34px; height: 34px; border-radius: 50%; background: #232325; border: none; color: #ddd;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .plus-btn svg { width: 16px; height: 16px; }
  .model-pill {
    background: #1e1e20; color: #ccc; border: none; border-radius: 16px; padding: 8px 14px; font-size: 14px;
    display: flex; align-items: center; gap: 4px; cursor: pointer; font-family: inherit;
  }
  .model-pill b { color: #fff; font-weight: 600; }

  .right-controls { display: flex; align-items: center; gap: 6px; }
  .mic-btn {
    width: 36px; height: 36px; border-radius: 50%; background: transparent; border: none; color: #ccc;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .mic-btn svg { width: 19px; height: 19px; }

  .send-btn {
    position: relative;
    width: 42px; height: 42px; border-radius: 50%; background: #fff; border: none; color: #000;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: transform 0.12s ease, background 0.2s ease;
    overflow: hidden;
  }
  .send-btn:active { transform: scale(0.88); }
  .send-btn .icon-voice, .send-btn .icon-arrow {
    position: absolute;
    width: 19px; height: 19px;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .send-btn .icon-arrow { opacity: 0; transform: scale(0.6); }
  .send-btn .icon-voice { opacity: 1; transform: scale(1); }
  .send-btn.has-text .icon-voice { opacity: 0; transform: scale(0.6); }
  .send-btn.has-text .icon-arrow { opacity: 1; transform: scale(1); }
  .send-btn.busy { background: #232325; color: #6bd486; cursor: default; }
  .send-btn.busy:active { transform: none; }
  .send-btn.busy .icon-voice, .send-btn.busy .icon-arrow { opacity: 0; }
  .send-btn .ring {
    position: absolute; inset: -2px; border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: #6bd486;
    display: none;
    animation: spin 0.9s linear infinite;
  }
  .send-btn.busy .ring { display: block; }
  .ripple {
    position: absolute; border-radius: 50%; background: rgba(0,0,0,0.15);
    transform: scale(0); animation: rippleAnim 0.5s ease-out forwards; pointer-events: none;
  }
  @keyframes rippleAnim { to { transform: scale(2.6); opacity: 0; } }

  .chat-scroll::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>
  <div class="phone">

    <div class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      </button>
      <button class="icon-btn" id="newChatTopBtn" aria-label="new chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <div class="chat-scroll" id="chatScroll">
      <div class="empty-state" id="emptyState">
        <div class="gear-badge">

<script>
  const chatScroll = document.getElementById('chatScroll');

  const inputCard = document.getElementById('inputCard');

  const MOD_ZIP_B64 = "UEsDBBQAAAAIAIJcCV1vm7ngwQAAABgBAAAKAAAAUkVBRE1FLnR4dCWPQW7EMAhF9znF16xaadqeoctsumoPQG0yQXHAshmluX3xzAoQ/78P36t0LFIYB3XcWLmRc8bvCcLPjN3Sdq8fmXcD1YqXy5eSEj7ny+v7NM2O8BNqocSrlcztSUuNH5x6b1xOuGEgtPvA41jJQdNQvmU7tBhl8F/lJqyJUcy2jiIbQ7RL5ohYKKY0jKLObYnA5wHZuEPNkUydREF6IuILbrRzfJBlkUQuplf01KT6FdbGYlqiDvlDGX0gupUA/wNQSwECFAMUAAAACACCXAldb5u54MEAAAAYAQAACgAAAAAAAAAAAAAApIEAAAAAUkVBRE1FLnR4dFBLBQYAAAAAAQABADgAAADpAAAAAAA=";

  let busy = false;

  // Per-chat state (build/fix/limit progress belongs to the conversation it happened in)

  let hasFixedOnce = false;
  let limitReached = false;
  let modVersion = 1;

  function defaultChatState() {
    return { hasBuiltMod: false, hasFixedOnce: false, limitReached: false, modVersion: 1 };
  }
  function genId() {
    return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  // Seed a couple of believable past chats so the sidebar feels lived-in.
  const chats = [
    {
      id: genId(),
      title: 'Weekend trip ideas',
      html: '<div class="bubble-row user"><div class="bubble user">give me some chill weekend trip ideas, nothing too far</div></div>' +
            '<div class="bubble-row bot"><div class="bubble bot">A few easy ones: a lakeside cabin for one night, a day hike somewhere nearby, or a low-key food crawl in a town you haven\'t explored yet.</div></div>',
      state: defaultChatState()
    },
    {
      id: genId(),
      title: 'GTA V splitscreen setup',
      html: '<div class="bubble-row user"><div class="bubble user">can u help me get 2 player splitscreen working for gta 5 on ps4</div></div>' +
            '<div class="bubble-row bot"><div class="bubble bot">Yeah, I can walk you through that — want me to build the script mod for you?</div></div>',
      state: defaultChatState()
    }
  ];
  let currentChat = { id: genId(), title: 'New chat', html: null, state: defaultChatState() };

  const MODELS = [
    { name: 'Nnana 9', tier: 'Opus', desc: 'Most capable, slower' },
    { name: 'Nnana 8', tier: 'Medium', desc: 'Balanced for everyday use' },
    { name: 'Nnana 8', tier: 'Fast', desc: 'Fastest responses' },
    { name: 'Nnana', tier: 'Mini', desc: 'Lightweight & quick' }
  ];
  let currentModel = MODELS[1];

  function haptic(pattern) {
    if (navigator.vibrate) {
      try { navigator.vibrate(pattern); } catch (e) {}
    }
  }

  function scrollToBottom() {
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }

  function clearEmptyState() {
    const es = chatScroll.querySelector('.empty-state');
    if (es) es.remove();
  }

  function addUserBubble(text) {
    clearEmptyState();
    const row = document.createElement('div');
    row.className = 'bubble-row user';
    const bubble = document.createElement('div');
    bubble.className = 'bubble user';
    bubble.textContent = text;
    row.appendChild(bubble);
    chatScroll.appendChild(row);
    scrollToBottom();
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'bubble-row bot';
    row.id = 'typingRow';
    const bubble = document.createElement('div');
    bubble.className = 'bubble bot typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(bubble);
    chatScroll.appendChild(row);
    scrollToBottom();
    return row;
  }

  function removeTyping() {
    const row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  function streamBotText(text) {
    return new Promise((resolve) => {
      clearEmptyState();
      const row = document.createElement('div');
      row.className = 'bubble-row bot';
      const bubble = document.createElement('div');
      bubble.className = 'bubble bot';
      const textSpan = document.createElement('span');
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      bubble.appendChild(textSpan);
      bubble.appendChild(cursor);
      row.appendChild(bubble);
      chatScroll.appendChild(row);
      scrollToBottom();

      const words = text.split(' ');
      let i = 0;
      haptic(12);

      function next() {
        if (i >= words.length) {
          cursor.remove();
          resolve(row);
          return;
        }
        textSpan.textContent += (i === 0 ? '' : ' ') + words[i];
        i++;
        scrollToBottom();
        const delay = 35 + Math.random() * 55;
        setTimeout(next, delay);
      }
      next();
    });
  }

  function addFileCard(filename, sizeLabel) {
    const row = document.createElement('div');
    row.className = 'bubble-row bot';
    const card = document.createElement('div');
    card.className = 'file-card';
    card.innerHTML = `

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
      </div>
      <div class="file-meta">

        <div class="file-sub">${sizeLabel} · SPRX Plugin</div>

      <div class="file-dl">

      </div>
    `;
    card.addEventListener('click', () => downloadFile(filename));
    row.appendChild(card);

    scrollToBottom();
    haptic([10, 40, 10]);

  function addLimitCard() {
    const row = document.createElement('div');

      <div class="limit-sub">You've used all your free script fixes for today. This resets in 30 days — or upgrade to Nnana Pro for unlimited builds and fixes.</div>
      <button class="limit-upgrade-btn">Upgrade to Nnana Pro</button>
      <div class="limit-note">Demo only — no real purchase happens here</div>
    `;
    const btn = card.querySelector('.limit-upgrade-btn');
    btn.addEventListener('click', () => { haptic([10, 20, 10]); openProModal(); });
    row.appendChild(card);
    chatScroll.appendChild(row);
    scrollToBottom();
    haptic([8, 20, 8, 20, 8]);
  }

  function downloadFile(filename) {
    const byteChars = atob(MOD_ZIP_B64);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  function setBusy(state) {
    busy = state;
    input.disabled = state || limitReached;
    sendBtn.classList.toggle('busy', state);
    if (!state) updateInputLockUI();
  }

  function updateInputLockUI() {
    input.placeholder = limitReached ? 'Upgrade to Nnana Pro to keep chatting' : 'Chat with Nnana AI';
    input.disabled = busy || limitReached;
    sendBtn.disabled = limitReached && !busy;
    sendBtn.style.opacity = limitReached ? '0.35' : '';
  }

  function updateSendIcon() {
    sendBtn.classList.toggle('has-text', input.value.trim().length > 0);
  }

  function runStepFlow(cardLabel, doneLabel, steps, durations) {
    return new Promise((resolve) => {
      clearEmptyState();
      const total = durations.reduce((a, b) => a + b, 0);

      const row = document.createElement('div');
      row.className = 'bubble-row bot';
      const card = document.createElement('div');
      card.className = 'build-card';

      const title = document.createElement('div');
      title.className = 'build-title';
      title.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        <span>${cardLabel}</span>
      `;

      const stepList = document.createElement('div');
      stepList.className = 'step-list';
      const stepEls = steps.map((label) => {
        const el = document.createElement('div');
        el.className = 'step';
        el.innerHTML = `<div class="dot"></div><span>${label}</span>`;
        stepList.appendChild(el);
        return el;
      });

      const track = document.createElement('div');
      track.className = 'progress-track';
      const fill = document.createElement('div');
      fill.className = 'progress-fill';
      track.appendChild(fill);

      card.appendChild(title);
      card.appendChild(stepList);
      card.appendChild(track);
      row.appendChild(card);
      chatScroll.appendChild(row);
      scrollToBottom();

      let elapsed = 0;
      let idx = 0;

      function runStep() {
        if (idx >= steps.length) {
          title.classList.add('done');
          title.querySelector('span').textContent = doneLabel;
          title.querySelector('svg').outerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`;
          haptic([10, 30, 10]);
          setTimeout(() => resolve(row), 300);
          return;
        }
        stepEls[idx].classList.add('active');
        haptic(8);
        const dur = durations[idx];
        const startElapsed = elapsed;
        const stepStart = performance.now();

        function tick() {
          const t = Math.min(1, (performance.now() - stepStart) / dur);
          const currentTotal = startElapsed + t * dur;
          fill.style.width = Math.min(100, (currentTotal / total) * 100) + '%';
          if (t < 1) {
            requestAnimationFrame(tick);
          } else {
            stepEls[idx].classList.remove('active');
            stepEls[idx].classList.add('done');
            stepEls[idx].querySelector('.dot').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
            elapsed += dur;
            idx++;
            runStep();
          }
        }
        requestAnimationFrame(tick);
      }
      runStep();
    });
  }

  function runBuildFlow() {
    const steps = [
      'Analyzing GTA V (PS4) file structure',
      'Setting up script mod framework',
      'Writing splitscreen camera logic',
      'Mapping dual-controller input',
      'Building player 2 UI overlay',
      'Compiling and packaging files',
      'Running final checks'
    ];
    const durations = [200, 300, 350, 300, 300, 300, 250]; // ~2s
    return runStepFlow('Building gta5-splitscreen-mod.sprx', 'Build complete', steps, durations);
  }

  function runFixFlow() {
    const steps = [
      'Reading crash + error logs',
      'Isolating the splitscreen desync bug',
      'Patching camera + input sync',
      'Re-testing stability'
    ];
    const durations = [400, 600, 600, 400]; // ~2s
    return runStepFlow('Patching gta5-splitscreen-mod.sprx', 'Patch complete', steps, durations);
  }

  function isModRequest(text) {
    const t = text.toLowerCase();
    const mentionsSplit = t.includes('splitscreen') || t.includes('split screen') || t.includes('split-screen');
    const mentionsGta = t.includes('gta');
    return mentionsSplit && mentionsGta;
  }

  function isFixRequest(text) {
    if (!hasBuiltMod) return false;
    const t = text.toLowerCase();
    const mentionsFix = t.includes('fix') || t.includes('unstable') || t.includes('crash') || t.includes('broken') || t.includes('bug');
    const mentionsThing = /\b(mod|script|splitscreen|split screen|it)\b/.test(t);
    return mentionsFix && mentionsThing;
  }

  function toTitleCase(s) {
    return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
  }

  function detectNameIntro(text) {
    const m = text.match(/\b(?:i am|i'm|im|my name is|name's|call me|this is)\s+([a-zA-Z]{2,20})\b/i);
    if (m) return toTitleCase(m[1]);
    return null;
  }

  function isGreeting(text) {
    const t = text.trim().toLowerCase().replace(/[!.?,]/g, '');
    const words = t.split(/\s+/).filter(Boolean);
    const greetWords = ['hello', 'hi', 'hey', 'yo', 'sup', 'hiya', 'howdy', 'heyy', 'hii'];
    return words.length <= 4 && words.some((w) => greetWords.includes(w));
  }

  function isWhoAmI(text) {
    const t = text.trim().toLowerCase().replace(/[!.?]/g, '');
    return t.includes('who am i') || t.includes('do you know who i am') || t.includes('guess who i am');
  }

  const greetReplies = ['Hey {name}! Ready to make something?', 'Hi {name}! What are we building today?', "Yo {name} — what's on your mind?"];
  const fallbacks = [
    "Got it, {name} — tell me more about what you're thinking.",
    'Sounds good, {name}! What should we build first?',
    "I'm listening — go ahead.",
    "Nice, let's dig into that."
  ];
  function fillName(template) { return template.replace('{name}', userName); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function updateSidebarProfile() {
    document.getElementById('profileName').textContent = userName;
    document.getElementById('profileAvatar').textContent = userName.charAt(0).toUpperCase();
    document.getElementById('profilePlan').textContent = proActive ? 'Pro plan' : 'Free plan';
  }

  // ----- Multi-chat: sidebar, new chat, revisiting past chats -----

  function renderChatList(filterText) {
    const listEl = document.getElementById('chatList');
    listEl.innerHTML = '';
    const q = (filterText || '').trim().toLowerCase();
    const visible = chats.filter((c) => !q || c.title.toLowerCase().includes(q));
    if (visible.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'sidebar-empty';
      empty.textContent = q ? 'No chats found' : 'No chats yet';
      listEl.appendChild(empty);
      return;
    }
    visible.forEach((chat) => {
      const item = document.createElement('button');
      item.className = 'chat-item' + (chat.id === currentChat.id ? ' active' : '');
      item.textContent = chat.title;
      item.addEventListener('click', () => switchToChat(chat));
      listEl.appendChild(item);
    });
  }

  function saveCurrentChatSnapshot() {
    const hasContent = !chatScroll.querySelector('.empty-state');
    if (hasContent) currentChat.html = chatScroll.innerHTML;
    currentChat.state = { hasBuiltMod, hasFixedOnce, limitReached, modVersion };
  }

  function loadChat(chat) {
    chatScroll.innerHTML = chat.html || EMPTY_STATE_HTML;
    hasBuiltMod = chat.state.hasBuiltMod;
    hasFixedOnce = chat.state.hasFixedOnce;
    limitReached = chat.state.limitReached;
    modVersion = chat.state.modVersion;
    updateInputLockUI();
    scrollToBottom();
  }

  function switchToChat(chat) {
    if (chat.id !== currentChat.id) {
      saveCurrentChatSnapshot();
      currentChat = chat;
      loadChat(chat);
      renderChatList(document.getElementById('chatSearchInput').value);
    }
    closeSidebar();
  }

  function startNewChat() {
    saveCurrentChatSnapshot();
    currentChat = { id: genId(), title: 'New chat', html: null, state: defaultChatState() };
    hasBuiltMod = false; hasFixedOnce = false; limitReached = false; modVersion = 1;
    chatScroll.innerHTML = EMPTY_STATE_HTML;
    updateInputLockUI();
    renderChatList(document.getElementById('chatSearchInput').value);
    closeSidebar();
    haptic(10);
  }

  function ensureChatSaved(firstMessageText) {
    if (currentChat.title === 'New chat') {
      currentChat.title = firstMessageText.length > 42 ? firstMessageText.slice(0, 42) + '…' : firstMessageText;
    }
    if (!chats.includes(currentChat)) chats.unshift(currentChat);
    renderChatList(document.getElementById('chatSearchInput').value);
  }

  const sidebarOverlay = document.getElementById('sidebarOverlay');
  function openSidebar() { renderChatList(''); document.getElementById('chatSearchInput').value = ''; sidebarOverlay.classList.add('open'); }
  function closeSidebar() { sidebarOverlay.classList.remove('open'); }

  document.getElementById('menuBtn').addEventListener('click', () => { haptic(8); openSidebar(); });
  document.getElementById('sidebarClose').addEventListener('click', () => { haptic(8); closeSidebar(); });
  sidebarOverlay.addEventListener('click', (e) => { if (e.target === sidebarOverlay) closeSidebar(); });
  document.getElementById('newChatBtn').addEventListener('click', startNewChat);
  document.getElementById('newChatTopBtn').addEventListener('click', startNewChat);
  document.getElementById('chatSearchInput').addEventListener('input', (e) => renderChatList(e.target.value));

  // ----- Model picker -----

  const modelModal = document.getElementById('modelModal');
  function renderModelList() {
    const listEl = document.getElementById('modelList');
    listEl.innerHTML = '';
    MODELS.forEach((m) => {
      const row = document.createElement('div');
      const isSelected = m.name === currentModel.name && m.tier === currentModel.tier;
      row.className = 'model-row' + (isSelected ? ' selected' : '');
      row.innerHTML = `
        <div class="model-row-main">
          <div class="model-row-name">${m.name} ${m.tier}</div>
          <div class="model-row-desc">${m.desc}</div>
        </div>
        <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      `;
      row.addEventListener('click', () => {
        currentModel = m;
        haptic(8);
        document.getElementById('modelPillLabel').innerHTML = `<b>${m.name}</b>&nbsp;${m.tier}`;
        renderModelList();
        setTimeout(closeModelModal, 200);
      });
      listEl.appendChild(row);
    });
  }
  function openModelModal() { renderModelList(); modelModal.classList.add('open'); }
  function closeModelModal() { modelModal.classList.remove('open'); }

  document.getElementById('modelPillBtn').addEventListener('click', () => { haptic(8); openModelModal(); });
  document.getElementById('modelClose').addEventListener('click', () => { haptic(8); closeModelModal(); });
  modelModal.addEventListener('click', (e) => { if (e.target === modelModal) closeModelModal(); });

  // ----- Pro subscription modal -----

  const proModal = document.getElementById('proModal');
  function openProModal() { proModal.classList.add('open'); }
  function closeProModal() { proModal.classList.remove('open'); }

  document.getElementById('proClose').addEventListener('click', () => { haptic(8); closeProModal(); });
  document.getElementById('proCancel').addEventListener('click', () => { haptic(8); closeProModal(); });
  document.getElementById('upgradeCardBtn').addEventListener('click', () => { haptic(8); openProModal(); });
  proModal.addEventListener('click', (e) => { if (e.target === proModal) closeProModal(); });

  const proSubscribe = document.getElementById('proSubscribe');
  proSubscribe.addEventListener('click', () => {
    haptic([10, 20, 10]);
    proSubscribe.disabled = true;
    proSubscribe.textContent = 'Processing…';
    setTimeout(() => {
      proSubscribe.classList.add('success');
      proSubscribe.textContent = 'Subscribed ✓';
      haptic([10, 30, 10]);
      setTimeout(async () => {
        closeProModal();
        limitReached = false;
        proActive = true;
        updateSidebarProfile();
        updateInputLockUI();
        proSubscribe.disabled = false;
        proSubscribe.classList.remove('success');
        proSubscribe.textContent = 'Subscribe for $999/month';
        await streamBotText(`Nnana Pro activated, ${userName} — unlimited fixes unlocked!`);
      }, 1000);
    }, 900);
  });

  // ----- Sending messages -----

  async function handleSend() {
    if (busy) return;
    if (limitReached) return; // hard lockout — shouldn't normally be reachable since the input is disabled too
    const text = input.value.trim();
    if (!text) return;

    addUserBubble(text);
    ensureChatSaved(text);
    input.value = '';
    input.style.height = 'auto';
    updateSendIcon();
    haptic(10);
    setBusy(true);

    if (isModRequest(text)) {
      addTyping();
      await new Promise((r) => setTimeout(r, 400 + Math.random() * 300));
      removeTyping();
      await streamBotText(`On it, ${userName} — building a 2 player splitscreen setup for GTA V on PS4.`);
      await runBuildFlow();
      await streamBotText("Here's a working 2 player split screen mod for GTA 5 PS4!");
      addFileCard('gta5-splitscreen-mod.sprx', '2.4 MB');
      hasBuiltMod = true;
      saveCurrentChatSnapshot();
      setBusy(false);
      return;
    }

    if (isFixRequest(text)) {
      addTyping();
      await new Promise((r) => setTimeout(r, 400 + Math.random() * 300));
      removeTyping();
      await streamBotText(`Got it — let me take a look at what's making it unstable.`);
      await runFixFlow();
      modVersion++;
      await streamBotText(`Fixed it, ${userName}! The split screen sync bug is patched — it should run stable now.`);
      addFileCard(`gta5-splitscreen-mod-v${modVersion}.sprx`, '2.5 MB');
      hasFixedOnce = true;

      // That was the one free fix — the limit hits right away now.
      addTyping();
      await new Promise((r) => setTimeout(r, 500 + Math.random() * 300));
      removeTyping();
      await streamBotText(`Heads up, ${userName} — that was your free fix for the next 30 days. You've hit your daily limit.`);
      addLimitCard();
      limitReached = true;
      updateInputLockUI();
      saveCurrentChatSnapshot();
      setBusy(false);
      return;
    }

    const introName = detectNameIntro(text);
    if (introName) {
      userName = introName;
      updateSidebarProfile();
      addTyping();
      await new Promise((r) => setTimeout(r, 500 + Math.random() * 350));
      removeTyping();
      await streamBotText(`Hi ${userName}, how are you?`);
      saveCurrentChatSnapshot();
      setBusy(false);
      return;
    }

    if (isWhoAmI(text)) {
      addTyping();
      await new Promise((r) => setTimeout(r, 500 + Math.random() * 350));
      removeTyping();
      await streamBotText(userName === 'Vans' ? "I don't know yet — what's your name?" : `You're ${userName}, of course!`);
      saveCurrentChatSnapshot();
      setBusy(false);
      return;
    }

    if (isGreeting(text)) {
      addTyping();
      await new Promise((r) => setTimeout(r, 450 + Math.random() * 300));
      removeTyping();
      await streamBotText(fillName(pick(greetReplies)));
      saveCurrentChatSnapshot();
      setBusy(false);
      return;
    }

    const thinkDelay = 500 + Math.min(text.length * 12, 1200) + Math.random() * 400;
    addTyping();
    await new Promise((r) => setTimeout(r, thinkDelay));
    removeTyping();
    await streamBotText(fillName(pick(fallbacks)));
    saveCurrentChatSnapshot();
    setBusy(false);
  }

  sendBtn.addEventListener('click', (e) => {
    if (busy) return;
    if (!input.value.trim()) return;
    const rect = sendBtn.getBoundingClientRect();
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    const size = rect.width;
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = ((e.clientX || rect.left + rect.width / 2) - rect.left - size / 2) + 'px';
    ripple.style.top = ((e.clientY || rect.top + rect.height / 2) - rect.top - size / 2) + 'px';
    sendBtn.appendChild(ripple);
    setTimeout(() => ripple.remove(), 500);
    handleSend();
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 100) + 'px';
    updateSendIcon();
  });

  input.addEventListener('focus', () => { inputCard.style.borderColor = '#3a3a3c'; });
  input.addEventListener('blur', () => { inputCard.style.borderColor = '#202022'; });

  // init
  updateSidebarProfile();
  updateInputLockUI();
  renderChatList('');
</script>
</body>
</html>
