        <div class="dat-row-label"><span class="dat-row-name">${esc(label)}${editedTag}</span><span class="dat-row-key">${esc(child.name)} (ARGB)</span></div>
        <button class="kf-swatch" style="background:${rgbHex}"><input type="color" class="tree-color-input" value="${rgbHex}"></button>
        <input type="text" class="kf-hex tree-hex-input" value="${rgbHex}" maxlength="7" spellcheck="false">
        <input type="number" class="dat-alpha-input" value="${a}" min="0" max="255" step="1" title="Alpha (0-255)">
      </div>`;
    }
    if (cls.kind === 'attrs'){
      const fields = child.attrs.map(a => {
        const v = treeAttrValue(child, a.name);
        const numeric = /^-?\d+(\.\d+)?$/.test(a.value);
        return `<div class="field"><label>${esc(a.name)}</label>
          <input type="${numeric?'number':'text'}" class="tree-attr-input" data-node="${id}" data-attr="${esc(a.name)}" value="${esc(v)}" ${numeric?'step="any"':''}></div>`;
      }).join('');
      return `<div class="dat-row" style="align-items:flex-start;" data-node="${id}">
        <div class="dat-row-label"><span class="dat-row-name">${esc(label)}${editedTag}</span><span class="dat-row-key">${esc(child.name)}</span></div>
        <div class="field-row">${fields}</div>
      </div>`;
    }
    // text
    const v = treeTextOf(child);
    return `<div class="dat-row" data-node="${id}">
      <div class="dat-row-label"><span class="dat-row-name">${esc(label)}${editedTag}</span><span class="dat-row-key">${esc(child.name)}</span></div>
      <input type="text" class="tree-text-input" data-node="${id}" value="${esc(v)}" style="width:180px;">
    </div>`;
  }

  function renderTreeSublist(containerChild, sub){
    const items = sub.items;
    let html = `<div class="section-label" style="margin-top:16px;">${esc(humanizeWords(containerChild.name))} <span class="count">(${items.length})</span></div>`;
    items.forEach((subItem, subIdx) => {
      const label = treeEntryLabel(subItem, subIdx);
      let subFields = '';
      treeElementChildren(subItem).forEach(child => {
        const cls = classifyTreeField(child);
        if (cls.kind === 'sublist') return; // cap at two levels — deep enough for these files
        subFields += renderTreeField(child, humanizeWords(child.name));
      });
      html += `<div class="param-card tree-entry" style="margin-bottom:6px;">
        <div class="card-head"><svg class="card-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
          <div class="card-main"><div class="param-name">${esc(label)}</div></div>
        </div>
        <div class="card-body">${subFields}</div>
      </div>`;
    });
    return html;
  }

  function treeEntryCardHtml(item, idx){
    const label = treeEntryLabel(item, idx);
    let fieldsHtml = '', sublistHtml = '';
    treeElementChildren(item).forEach(child => {
      const cls = classifyTreeField(child);
      if (cls.kind === 'sublist') sublistHtml += renderTreeSublist(child, cls.sub);
      else fieldsHtml += renderTreeField(child, humanizeWords(child.name));
    });
    return `<div class="param-card tree-entry" data-entry-idx="${idx}">
      <div class="card-head"><svg class="card-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
        <div class="card-main"><div class="param-name">${esc(label)}</div></div>
      </div>
      <div class="card-body">${fieldsHtml}${sublistHtml}</div>
    </div>`;
  }

  function countTreeEdited(){
    let n = 0;
    Object.values(treeNodeRegistry).forEach(node => {
      const cls = classifyTreeField(node);
      if (treeFieldEdited(node, cls)) n++;
    });
    return n;
  }

  function buildTreeEditor(){
    treeNodeRegistry = {}; treeNodeIdCounter = 0;
    const rootEl = treeNodes.find(n => n.type === 'element');
    treeList = rootEl ? findItemList(rootEl, 0) : null;
    if (!treeList || !treeList.items.length){
      editorRoot.innerHTML = '<div class="detail-empty" style="padding:40px 20px;text-align:center;color:var(--text-dim);">Could not find a list of entries in this file.</div>';
      navScrollWrap.style.display = 'none';
      return;
    }
    let html = `<div class="toolrow">
      <span class="stat-pill"><b>${treeList.items.length}</b> entries</span>
      <span class="stat-pill"><b id="treeEditedCount">${countTreeEdited()}</b> edited</span>
      <button class="btn small" id="resetAllBtn">Reset all</button>
    </div>`;
    html += `<div class="section-block" id="sec-entries">`;
    treeList.items.forEach((item, idx) => { html += treeEntryCardHtml(item, idx); });
    html += `</div>`;
    editorRoot.innerHTML = html;
    bindTreeEvents();
    navScrollWrap.style.display = 'none';
    applyTreeFilter();
  }

  function bindTreeEvents(){
    document.getElementById('resetAllBtn').addEventListener('click', () => {
      if (confirm('Reset every entry back to the file as originally loaded?')){ loadText(originalText, fileName); showToast('All changes reset.'); }
    });
    editorRoot.querySelectorAll('.tree-entry > .card-head').forEach(head => {
      head.addEventListener('click', () => head.closest('.tree-entry').classList.toggle('open'));
    });

    editorRoot.querySelectorAll('.tree-attr-input, .tree-vec-input').forEach(inp => {
      inp.addEventListener('input', () => {
        const node = treeNodeRegistry[Number(inp.dataset.node)];
        const v = parseFloat(inp.value);
        if (!Number.isNaN(v) || inp.value === '' || inp.value === '-'){
          treeSetAttr(node, inp.dataset.attr, inp.value);
          refreshTreeRowChrome(inp.closest('.dat-row'), node);
        }
      });
    });
    editorRoot.querySelectorAll('.tree-text-input').forEach(inp => {
      inp.addEventListener('input', () => {
        const node = treeNodeRegistry[Number(inp.dataset.node)];
        treeSetElementText(node, inp.value);
        refreshTreeRowChrome(inp.closest('.dat-row'), node);
      });
    });
    editorRoot.querySelectorAll('.dat-color-row[data-argb]').forEach(row => {
      const node = treeNodeRegistry[Number(row.dataset.node)];
      const colorInput = row.querySelector('.tree-color-input');
      const hexInput = row.querySelector('.tree-hex-input');
      const alphaInput = row.querySelector('.dat-alpha-input');
      const applyColor = (rgbHex) => {
        const a = parseFloat(alphaInput.value) || 0;
        treeSetAttr(node, 'value', packedFromArgb(a, rgbHex));
        row.querySelector('.kf-swatch').style.background = rgbHex;
        colorInput.value = rgbHex; hexInput.value = rgbHex;
        refreshTreeRowChrome(row, node);
      };
      colorInput.addEventListener('input', () => applyColor(colorInput.value));
      const commitHex = () => {
        const hex = normalizeHex(hexInput.value);
        if (!hex){ showToast('That is not a valid hex code — try something like #3399ff.'); return; }
        applyColor(hex);
      };
      hexInput.addEventListener('change', commitHex);
      hexInput.addEventListener('keydown', e => { if (e.key==='Enter'){ commitHex(); hexInput.blur(); } });
      alphaInput.addEventListener('input', () => applyColor(colorInput.value));
    });
  }

  function refreshTreeRowChrome(row, node){
    if (row){
      const cls = classifyTreeField(node);
      const edited = treeFieldEdited(node, cls);
      const nameEl = row.querySelector('.dat-row-name');
      const tagEl = nameEl.querySelector('.changed-tag');
      if (edited && !tagEl) nameEl.insertAdjacentHTML('beforeend', ' <span class="changed-tag">EDITED</span>');
      if (!edited && tagEl) tagEl.remove();
    }
    const stat = document.getElementById('treeEditedCount');
    if (stat) stat.textContent = countTreeEdited();
  }

  function applyTreeFilter(){
    const q = treeFilter;
    editorRoot.querySelectorAll('#sec-entries > .tree-entry').forEach(card => {
      if (!q){ card.classList.remove('is-hidden'); return; }
      card.classList.toggle('is-hidden', card.querySelector('.param-name').textContent.toLowerCase().indexOf(q) === -1);
    });
  }

  // ---------- cloudkey-mode UI (cloudkeyframes.xml — 14-point day/night color curves) ----------
  const CK_FIELD_LABELS = {
    CloudColor:"Cloud color", CloudLightColor:"Cloud light color", CloudAmbientColor:"Cloud ambient color",
    CloudBounceColor:"Cloud bounce color", CloudEastColor:"Cloud color (east)", CloudWestColor:"Cloud color (west)",
    CloudSkyColor:"Cloud sky color", CloudScaleFillColors:"Cloud scale/fill color"
  };
  let ckFieldRegistry = {};
  let ckFieldIdCounter = 0;
  let ckHours = CLOUDKEY_HOURS;

  function ckParseKeyData(keyDataNode){
    const numEntriesNode = treeFindFirst(keyDataNode.children, 'numKeyEntries');
    const n = parseInt(treeAttrValue(numEntriesNode, 'value'), 10);
    const keyEntryNode = treeFindFirst(keyDataNode.children, 'keyEntryData');
    const textNode = treeMainTextChild(keyEntryNode);
    const tokens = textNode.raw.trim().split(/\s+/).map(Number);
    const cols = tokens.length / n;
    const rows = [];
    for (let i=0;i<n;i++) rows.push(tokens.slice(i*cols, (i+1)*cols));
    return { n, cols, rows, textNode, keyEntryNode };
  }
  function ckWriteKeyData(kd){
    const lines = kd.rows.map(r => r.map(v => Number(v).toFixed(6)).join('\t'));
    kd.textNode.raw = '\n\t\t\t  ' + lines.join('\n\t\t\t  ') + '\n\t\t\t';
  }
  function ckFieldEdited(kd){ return kd.textNode.raw !== kd.textNode._origRaw; }

  function ckColorFieldHtml(fieldNode, label){
    const keyData = treeFindFirst(fieldNode.children, 'keyData');
    if (!keyData) return '';
    const kd = ckParseKeyData(keyData);
    const id = ckFieldIdCounter++;
    ckFieldRegistry[id] = kd;
    const dayIdx = ckHours.indexOf(12), nightIdx = ckHours.indexOf(0);
    const rowHex = i => hexFromFloats(kd.rows[i][1], kd.rows[i][2], kd.rows[i][3]);
    const stops = ckHours.map((h,idx) => ({ hour:h, hex: rowHex(idx) }));
    const edited = ckFieldEdited(kd);
    const strip = ckHours.map((h,idx) => `
      <div class="kf-point">
        <button class="kf-swatch" style="background:${rowHex(idx)}"><input type="color" class="ck-color-input" data-field="${id}" data-idx="${idx}" value="${rowHex(idx)}"></button>
        <input type="text" class="kf-hex ck-hex-input" data-field="${id}" data-idx="${idx}" value="${rowHex(idx)}" maxlength="7" spellcheck="false">
        <span class="kf-hour">${hourLabel(h)}</span>
      </div>`).join('');
    return `
    <div class="param-card tree-entry ck-color-card" data-field="${id}">
      <div class="card-head">
        <svg class="card-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
        <div class="card-main">
          <div class="param-name">${esc(label)} ${edited?'<span class="changed-tag">EDITED</span>':''}</div>
          <div class="preview-wrap"><div class="gradient-bar" style="background:${gradientCss(stops)}"></div></div>
        </div>
        <div class="quickrow" onclick="event.stopPropagation()">
          <div class="quick-item"><span class="quick-label">Day</span>
            <button class="kf-swatch quick-swatch" style="background:${rowHex(dayIdx)}"><input type="color" class="ck-color-input" data-field="${id}" data-idx="${dayIdx}" value="${rowHex(dayIdx)}"></button>
          </div>
          <div class="quick-item"><span class="quick-label">Night</span>
            <button class="kf-swatch quick-swatch" style="background:${rowHex(nightIdx)}"><input type="color" class="ck-color-input" data-field="${id}" data-idx="${nightIdx}" value="${rowHex(nightIdx)}"></button>
          </div>
        </div>
      </div>
      <div class="card-body"><div class="keyframe-strip">${strip}</div></div>
    </div>`;
  }

  function ckEntryCardHtml(item, idx){
    const label = treeEntryLabel(item, idx);
    const settings = treeFindFirst(item.children, 'Settings');
    let html = '';
    if (settings){
      Object.keys(CK_FIELD_LABELS).forEach(tag => {
        const fieldNode = treeFindFirst(settings.children, tag);
        if (fieldNode) html += ckColorFieldHtml(fieldNode, CK_FIELD_LABELS[tag]);
      });
    }
    return `<div class="param-card tree-entry" data-entry-idx="${idx}">
      <div class="card-head"><svg class="card-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
        <div class="card-main"><div class="param-name">${esc(label)}</div></div>
      </div>
      <div class="card-body">${html}</div>
    </div>`;
  }

  function ckCountEdited(){
    return Object.values(ckFieldRegistry).filter(ckFieldEdited).length;
  }

  function buildCloudkeyEditor(){
    ckFieldRegistry = {}; ckFieldIdCounter = 0;
    const rootEl = ckNodes.find(n => n.type === 'element');
    const kfTimesNode = treeFindFirst(rootEl.children, 'KeyframeTimes');
    ckHours = treeTextOf(kfTimesNode).trim().split(/\s+/).map(Number);
    const settingsMap = treeFindFirst(rootEl.children, 'SettingsMap');
    ckItems = settingsMap ? treeElementChildren(settingsMap).filter(c => c.name === 'Item') : [];

    let html = `<div class="toolrow">
      <span class="stat-pill"><b>${ckItems.length}</b> weather types</span>
      <span class="stat-pill"><b id="ckEditedCount">0</b> edited</span>
      <button class="btn small" id="resetAllBtn">Reset all</button>
    </div>`;
    html += `<div class="section-block" id="sec-ckentries">`;
    ckItems.forEach((item, idx) => { html += ckEntryCardHtml(item, idx); });
    html += `</div>`;
    editorRoot.innerHTML = html;
    document.getElementById('ckEditedCount').textContent = ckCountEdited();
    bindCloudkeyEvents();
    navScrollWrap.style.display = 'none';
    applyCkFilter();
  }

  function bindCloudkeyEvents(){
    document.getElementById('resetAllBtn').addEventListener('click', () => {
      if (confirm('Reset every weather type back to the file as originally loaded?')){ loadText(originalText, fileName); showToast('All changes reset.'); }
    });
    editorRoot.querySelectorAll('.tree-entry > .card-head').forEach(head => {
      head.addEventListener('click', () => head.closest('.tree-entry').classList.toggle('open'));
    });

    editorRoot.querySelectorAll('.ck-color-card').forEach(card => {
      const id = Number(card.dataset.field);
      const kd = ckFieldRegistry[id];
      function applyIdx(idx, hex){
        const [r,g,b] = floatsFromHex(hex);
        kd.rows[idx][1] = r; kd.rows[idx][2] = g; kd.rows[idx][3] = b;
        ckWriteKeyData(kd);
        card.querySelectorAll(`[data-field="${id}"][data-idx="${idx}"]`).forEach(el => {
          if (el.classList.contains('ck-color-input')) el.value = hex;
          if (el.classList.contains('ck-hex-input')) el.value = hex;
          const sw = el.closest('.kf-swatch'); if (sw) sw.style.background = hex;
        });
        refreshCkCardChrome(card, kd);
      }
      card.querySelectorAll('.ck-color-input').forEach(inp => {
        inp.addEventListener('input', () => applyIdx(Number(inp.dataset.idx), inp.value));
      });
      card.querySelectorAll('.ck-hex-input').forEach(inp => {
        const commit = () => {
          const hex = normalizeHex(inp.value);
          if (!hex){ showToast('That is not a valid hex code — try something like #3399ff.'); return; }
          applyIdx(Number(inp.dataset.idx), hex);
        };
        inp.addEventListener('change', commit);
        inp.addEventListener('keydown', e => { if (e.key==='Enter'){ commit(); inp.blur(); } });
      });
    });
  }

  function refreshCkCardChrome(card, kd){
    const edited = ckFieldEdited(kd);
    const nameEl = card.querySelector('.param-name');
    const tagEl = nameEl.querySelector('.changed-tag');
    if (edited && !tagEl) nameEl.insertAdjacentHTML('beforeend', ' <span class="changed-tag">EDITED</span>');
    if (!edited && tagEl) tagEl.remove();
    const stops = ckHours.map((h,idx) => ({ hour:h, hex: hexFromFloats(kd.rows[idx][1],kd.rows[idx][2],kd.rows[idx][3]) }));
    card.querySelector('.gradient-bar').style.background = gradientCss(stops);
    const stat = document.getElementById('ckEditedCount');
    if (stat) stat.textContent = ckCountEdited();
  }

  function applyCkFilter(){
    const q = ckFilter;
    editorRoot.querySelectorAll('#sec-ckentries > .tree-entry').forEach(card => {
      if (!q){ card.classList.remove('is-hidden'); return; }
      card.classList.toggle('is-hidden', card.querySelector('.param-name').textContent.toLowerCase().indexOf(q) === -1);
    });
  }

  function applyAttrFilter(){
    const q = attrFilter;
    editorRoot.querySelectorAll('.attr-row').forEach(row => {
      if (!q){ row.classList.remove('is-hidden'); return; }
      row.classList.toggle('is-hidden', row.querySelector('.param-name').textContent.toLowerCase().indexOf(q) === -1);
    });
    editorRoot.querySelectorAll('.attr-group-block').forEach(block => {
      const visible = block.querySelectorAll('.attr-row:not(.is-hidden)').length;
      block.style.display = (q && visible === 0) ? 'none' : '';
    });
  }

  searchInput.addEventListener('input', () => {
    if (currentFormat === 'dat'){
      datFilter = searchInput.value.trim().toLowerCase();
      applyDatFilter();
    } else if (currentFormat === 'attr'){
      attrFilter = searchInput.value.trim().toLowerCase();
      applyAttrFilter();
    } else if (currentFormat === 'tree'){
      treeFilter = searchInput.value.trim().toLowerCase();
      applyTreeFilter();
    } else if (currentFormat === 'cloudkey'){
      ckFilter = searchInput.value.trim().toLowerCase();
      applyCkFilter();
    } else {
      currentFilter = searchInput.value.trim().toLowerCase();
      applyFilter();
    }
  });

  // ---------- FILE LOAD / SAVE ----------
  function loadText(text, name){
    originalText = text;
    fileName = name;
    currentFormat = detectFormat(text);
    searchInput.value = '';

    if (currentFormat === 'dat'){
      const parsed = parseDat(text);
      datLines = parsed.lines;
      datEntries = parsed.entries;
      datOriginalSnapshot = datEntries.map(e => e.value);
      datFilter = '';
      searchInput.placeholder = 'Search settings (e.g. rain, sky, weather)…';

      filenameTag.textContent = fileName;
      exportBtn.disabled = false;
      emptyState.style.display = 'none';
      fileRow.style.display = 'flex';
      searchRow.style.display = 'flex';
      editorRoot.style.display = 'block';
      buildDatEditor();
      return;
    }

    if (currentFormat === 'attr'){
      const parsed = parseAttrXML(text);
      attrSegs = parsed.segments;
      attrEntries = parsed.entries;
      attrFilter = '';
      searchInput.placeholder = 'Search settings…';

      filenameTag.textContent = fileName;
      exportBtn.disabled = false;
      emptyState.style.display = 'none';
      fileRow.style.display = 'flex';
      searchRow.style.display = 'flex';
      editorRoot.style.display = 'block';
      buildAttrEditor();
      return;
    }

    if (currentFormat === 'tree'){
      treeNodes = parseTree(text);
      snapshotTreeText(treeNodes);
      treeFilter = '';
      searchInput.placeholder = 'Search entries by name…';

      filenameTag.textContent = fileName;
      exportBtn.disabled = false;
      emptyState.style.display = 'none';
      fileRow.style.display = 'flex';
      searchRow.style.display = 'flex';
      editorRoot.style.display = 'block';
      buildTreeEditor();
      return;
    }

    if (currentFormat === 'cloudkey'){
      ckNodes = parseTree(text);
      snapshotTreeText(ckNodes);
      ckFilter = '';
      searchInput.placeholder = 'Search weather types…';

      filenameTag.textContent = fileName;
      exportBtn.disabled = false;
      emptyState.style.display = 'none';
      fileRow.style.display = 'flex';
      searchRow.style.display = 'flex';
      editorRoot.style.display = 'block';
      buildCloudkeyEditor();
      return;
    }

    const parsed = parseXML(text);
    flatSegments = parsed.segments;
    cycles = parsed.regions;
    currentRegionIdx = 0;
    currentFilter = '';
    searchInput.placeholder = 'Search parameters (e.g. sky, fog, exposure)…';
    originalSnapshot = cycles.map(r => {
      const m = {};
      Object.keys(r.params).forEach(tag => { m[tag] = r.params[tag].values.slice(); });
      return m;
    });

    filenameTag.textContent = fileName;
    exportBtn.disabled = false;
    emptyState.style.display = 'none';
    fileRow.style.display = 'flex';
    searchRow.style.display = 'flex';
    editorRoot.style.display = 'block';
    buildEditor();
  }

  function handleFile(file){
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        loadText(String(e.target.result), file.name);
        showToast(`Opened ${file.name}`);
      } catch(err){
        showToast(err.message);
        console.error(err);
      }
    };
    reader.onerror = () => showToast("Couldn't read that file.");
    reader.readAsText(file, 'utf-8');
  }

  function downloadExport(){
    let out, mime;
    if (currentFormat === 'dat'){
      if (!datEntries.length) return;
      out = serializeDat(datLines, datEntries);
      mime = 'text/plain';
    } else if (currentFormat === 'attr'){
      if (!attrEntries.length) return;
      out = serializeAttrXML(attrSegs);
      mime = 'application/xml';
    } else if (currentFormat === 'tree'){
      if (!treeNodes.length) return;
      out = serializeTree(treeNodes);
      mime = 'application/xml';
    } else if (currentFormat === 'cloudkey'){
      if (!ckNodes.length) return;
      out = serializeTree(ckNodes);
      mime = 'application/xml';
    } else {
      if (!cycles.length) return;
      out = serialize();
      mime = 'application/xml';
    }
    const blob = new Blob([out], {type: mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName || (currentFormat === 'dat' ? 'visualsettings.dat' : 'timecycle.xml');
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(`Downloaded ${a.download}`);
  }

  // Collects every keyframe the user actually touched in the currently open file, by region
  // name and tag, as {indices, values} pairs — so re-applying it elsewhere only overwrites
  // the specific hours that were changed here, never a whole day/night curve at once.
  function computeSessionDiff(){
    const diff = {}; // regionName -> tag -> { indices:[...], values:[...] }
    let changedCount = 0;
    cycles.forEach((r, idx) => {
      const snap = originalSnapshot[idx] || {};
      const tagDiffs = {};
      Object.keys(r.params).forEach(tag => {
        const cur = r.params[tag].values;
        const orig = snap[tag];
        if (!orig) return;
        const indices = [], values = [];
        for (let i=0;i<cur.length;i++){
          if (Math.abs(cur[i] - orig[i]) > 1e-6){ indices.push(i); values.push(cur[i]); }
        }
        if (indices.length){ tagDiffs[tag] = { indices, values }; changedCount += indices.length; }
      });
      if (Object.keys(tagDiffs).length) diff[r.name] = tagDiffs;
    });
    return { diff, changedCount };
  }

  function applyDiffToText(targetText, diff){
    const parsed = parseXML(targetText);
    let applied = 0;
    parsed.regions.forEach(r => {
      const tagDiffs = diff[r.name];
      if (!tagDiffs) return;
      Object.keys(tagDiffs).forEach(tag => {
        if (!r.params[tag]) return;
        const { indices, values } = tagDiffs[tag];
        indices.forEach((idx, i) => { r.params[tag].values[idx] = values[i]; applied++; });
      });
    });
    return { text: serialize(parsed.segments), applied };
  }

  function computeDatSessionDiff(){
    const diff = {};
    let changedCount = 0;
    datEntries.forEach((e, idx) => {
      if (datEntryEdited(idx)){ diff[e.key] = e.value; changedCount++; }
    });
    return { diff, changedCount };
  }

  function applyDatDiffToText(targetText, diff){
    const parsed = parseDat(targetText);
    let applied = 0;
    parsed.entries.forEach(e => {
      if (Object.prototype.hasOwnProperty.call(diff, e.key)){ e.value = diff[e.key]; applied++; }
    });
    return { text: serializeDat(parsed.lines, parsed.entries), applied };
  }

  function attrEntryKey(entry, occurrenceIdx){
    const distinguishing = ['name','hour'].map(n => entry.attrs.find(a=>a.name===n)).find(Boolean);
    return distinguishing ? `${entry.tag}::${distinguishing.value}` : `${entry.tag}::#${occurrenceIdx}`;
  }
  function computeAttrSessionDiff(){
    const diff = {};
    let changedCount = 0;
    const seenPerTag = {};
    attrEntries.forEach(entry => {
      seenPerTag[entry.tag] = (seenPerTag[entry.tag] || 0);
      const key = attrEntryKey(entry, seenPerTag[entry.tag]);
      seenPerTag[entry.tag]++;
      Object.keys(entry.current).forEach(attrName => {
        const orig = entry.attrs.find(a=>a.name===attrName).value;
        if (entry.current[attrName] !== orig){
          diff[key] = diff[key] || {};
          diff[key][attrName] = entry.current[attrName];
          changedCount++;
        }
      });
    });
    return { diff, changedCount };
  }
  function applyAttrDiffToText(targetText, diff){
    const parsed = parseAttrXML(targetText);
    let applied = 0;
    const seenPerTag = {};
    parsed.entries.forEach(entry => {
      seenPerTag[entry.tag] = (seenPerTag[entry.tag] || 0);
      const key = attrEntryKey(entry, seenPerTag[entry.tag]);
      seenPerTag[entry.tag]++;
      const attrDiff = diff[key];
      if (!attrDiff) return;
      Object.keys(attrDiff).forEach(attrName => {
        if (entry.attrs.some(a=>a.name===attrName)){ setAttrValue(entry, attrName, attrDiff[attrName]); applied++; }
      });
    });
    return { text: serializeAttrXML(parsed.segments), applied };
  }

  function handleApplyToFile(file){
    if (!file) return;
    if (currentFormat === 'tree' || currentFormat === 'cloudkey'){
      showToast("Applying to another file isn't available yet for this file type — download and reopen instead.");
      return;
    }
    if (currentFormat === 'attr'){
      const { diff, changedCount } = computeAttrSessionDiff();
      if (!changedCount){ showToast("You haven't changed anything in this file yet."); return; }
      const reader3 = new FileReader();
      reader3.onload = e => {
        let result;
        try { result = applyAttrDiffToText(String(e.target.result), diff); }
        catch(err){ showToast(err.message); console.error(err); return; }
        if (!result.applied){ showToast(`${file.name} doesn't share any of the changed fields — nothing applied.`); return; }
        const blob = new Blob([result.text], {type:'application/xml'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = file.name;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast(`Applied ${result.applied} value${result.applied===1?'':'s'} to ${file.name} — downloaded.`);
      };
      reader3.onerror = () => showToast("Couldn't read that file.");
      reader3.readAsText(file, 'utf-8');
      return;
    }
    if (currentFormat === 'dat'){
      const { diff, changedCount } = computeDatSessionDiff();
      if (!changedCount){ showToast("You haven't changed anything in this file yet."); return; }
      const reader2 = new FileReader();
      reader2.onload = e => {
        let result;
        try { result = applyDatDiffToText(String(e.target.result), diff); }
        catch(err){ showToast(err.message); console.error(err); return; }
        if (!result.applied){ showToast(`${file.name} doesn't share any of the changed keys — nothing applied.`); return; }
        const blob = new Blob([result.text], {type:'text/plain'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = file.name;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast(`Applied ${result.applied} value${result.applied===1?'':'s'} to ${file.name} — downloaded.`);
      };
      reader2.onerror = () => showToast("Couldn't read that file.");
      reader2.readAsText(file, 'utf-8');
      return;
    }

    const { diff, changedCount } = computeSessionDiff();
    if (!changedCount){ showToast("You haven't changed anything in this file yet."); return; }
    const reader = new FileReader();
    reader.onload = e => {
      let result;
      try { result = applyDiffToText(String(e.target.result), diff); }
      catch(err){ showToast(err.message); console.error(err); return; }
      if (!result.applied){ showToast(`${file.name} doesn't share any of the changed fields — nothing applied.`); return; }
      const blob = new Blob([result.text], {type:'application/xml'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = file.name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(`Applied ${result.applied} value${result.applied===1?'':'s'} to ${file.name} — downloaded.`);
    };
    reader.onerror = () => showToast("Couldn't read that file.");
    reader.readAsText(file, 'utf-8');
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(()=>t.classList.remove('show'), 2600);
  }

  // ---------- EVENTS ----------
  const fileInput = document.getElementById('fileInput');
  document.getElementById('dropTarget').addEventListener('click', () => fileInput.click());
  document.getElementById('loadBtn2').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });
  exportBtn.addEventListener('click', downloadExport);

  const applyToFileInput = document.getElementById('applyToFileInput');
  document.getElementById('applyToFileBtn').addEventListener('click', () => {
    if (!cycles.length && !datEntries.length && !attrEntries.length && !treeNodes.length && !ckNodes.length){ showToast('Open a file first.'); return; }
    applyToFileInput.click();
  });
  applyToFileInput.addEventListener('change', e => {
    if (e.target.files[0]) handleApplyToFile(e.target.files[0]);
    applyToFileInput.value = '';
  });

  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    e.preventDefault();
    const f = e.dataTransfer.files[0];
    if (f) handleFile(f);
  });
  document.getElementById('dropTarget').addEventListener('dragover', e => {
    e.preventDefault(); e.currentTarget.classList.add('dragover');
  });
  document.getElementById('dropTarget').addEventListener('dragleave', e => {
    e.currentTarget.classList.remove('dragover');
  });
})();
</script>
