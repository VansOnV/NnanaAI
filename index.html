<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nnana AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif;
    color: #fff;
    overflow: hidden;
  }
  .phone {
    max-width: 460px;
    margin: 0 auto;
    height: 100vh;
    background: #000;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Top bar */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 22px 10px;
    flex-shrink: 0;
  }
  .icon-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: #1a1a1c;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #cfcfcf;
    cursor: pointer;
    border: none;
  }
  .icon-btn svg { width: 20px; height: 20px; }

  /* Chat area */
  .chat-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 6px 20px 10px;
    display: flex;
    flex-direction: column;
  }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 20px;
    padding-bottom: 40px;
  }
  .gear-badge {
    width: 84px;
    height: 84px;
    border-radius: 22px;
    background: radial-gradient(circle at 32% 28%, #6bd486, #2f9450 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 20px rgba(60, 180, 100, 0.25);
  }
  .gear-badge svg { width: 46px; height: 46px; color: #0d3319; }
  .empty-state h1 {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .upgrade-card {
    width: 100%;
    max-width: 380px;
    background: #131315;
    border: 1px solid #232325;
    border-radius: 20px;
    padding: 18px 20px 20px;
    text-align: left;
  }
  .upgrade-card p {
    color: #9a9a9d;
    font-size: 14px;
    margin-bottom: 14px;
  }
  .upgrade-btn {
    width: 100%;
    background: #232325;
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 13px 0;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }

  .bubble-row { display: flex; margin: 6px 0; }
  .bubble-row.user { justify-content: flex-end; }
  .bubble-row.bot { justify-content: flex-start; }
  .bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 20px;
    font-size: 16px;
    line-height: 1.4;
  }
  .bubble.user { background: #2f7a45; color: #fff; border-bottom-right-radius: 6px; }
  .bubble.bot { background: #1a1a1c; color: #f0f0f0; border-bottom-left-radius: 6px; }

  .typing { display: flex; gap: 4px; padding: 14px 16px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: #888;
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.3; }
    40% { opacity: 1; }
  }

  /* Input area */
  .input-wrap { padding: 8px 16px 24px; flex-shrink: 0; }
  .input-card {
    background: #131315;
    border: 1px solid #202022;
    border-radius: 28px;
    padding: 14px 18px 10px;
  }
  .input-card textarea {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-size: 17px;
    resize: none;
    font-family: inherit;
    max-height: 100px;
  }
  .input-card textarea::placeholder { color: #7d7d80; }

  .input-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
  }
  .left-controls { display: flex; align-items: center; gap: 10px; }
  .plus-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: #232325;
    border: none;
    color: #ddd;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .plus-btn svg { width: 16px; height: 16px; }
  .model-pill {
    background: #1e1e20;
    color: #ccc;
    border-radius: 16px;
    padding: 8px 14px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  .model-pill b { color: #fff; font-weight: 600; }

  .right-controls { display: flex; align-items: center; gap: 6px; }
  .mic-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: transparent;
    border: none;
    color: #ccc;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .mic-btn svg { width: 19px; height: 19px; }
  .send-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: #fff;
    border: none;
    color: #000;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s ease;
  }
  .send-btn svg { width: 19px; height: 19px; }
  .send-btn:active { transform: scale(0.9); }

  .chat-scroll::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>
  <div class="phone">

    <div class="topbar">
      <button class="icon-btn" aria-label="menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      </button>
      <button class="icon-btn" aria-label="profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 10h.01"/><path d="M15 10h.01"/><path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z"/></svg>
      </button>
    </div>

    <div class="chat-scroll" id="chatScroll">
      <div class="empty-state" id="emptyState">
        <div class="gear-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
        <h1>Nnana AI</h1>
        <div class="upgrade-card">
          <p>Get more with Nnana Pro</p>
          <button class="upgrade-btn">Upgrade</button>
        </div>
      </div>
    </div>

    <div class="input-wrap">
      <div class="input-card">
        <textarea id="msgInput" rows="1" placeholder="Chat with Nnana AI"></textarea>
        <div class="input-controls">
          <div class="left-controls">
            <button class="plus-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
            </button>
            <div class="model-pill"><b>Nnana 8</b>&nbsp;Medium</div>
          </div>
          <div class="right-controls">
            <button class="mic-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
            </button>
            <button class="send-btn" id="sendBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  const chatScroll = document.getElementById('chatScroll');
  const emptyState = document.getElementById('emptyState');
  const input = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');

  function scrollToBottom() {
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }

  function addBubble(text, who) {
    if (emptyState && emptyState.parentNode) {
      emptyState.remove();
    }
    const row = document.createElement('div');
    row.className = 'bubble-row ' + who;
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + who;
    bubble.textContent = text;
    row.appendChild(bubble);
    chatScroll.appendChild(row);
    scrollToBottom();
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'bubble-row bot';
    row.id = 'typingRow';
    const bubble = document.createElement('div');
    bubble.className = 'bubble bot typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(bubble);
    chatScroll.appendChild(row);
    scrollToBottom();
  }

  function removeTyping() {
    const row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  function getReply(text) {
    const normalized = text.trim().toLowerCase().replace(/[!.?]/g, '');
    if (normalized.includes('nnana')) {
      return "Hi Vans!, Ready to make something?";
    }
    const fallbacks = [
      "Got it, Vans — tell me more about what you're thinking.",
      "Sounds good! What should we build first?",
      "I'm listening — go ahead.",
      "Nice, let's dig into that."
    ];
    return fallbacks[Math.floor(Math.random() * fallbacks.length)];
  }

  function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    addBubble(text, 'user');
    input.value = '';
    input.style.height = 'auto';
    showTyping();
    const delay = 700 + Math.random() * 500;
    setTimeout(() => {
      removeTyping();
      addBubble(getReply(text), 'bot');
    }, delay);
  }

  sendBtn.addEventListener('click', sendMessage);

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 100) + 'px';
  });
</script>
</body>
</html>
